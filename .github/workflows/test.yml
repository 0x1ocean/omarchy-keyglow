name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: node --test test/*.test.js
      - name: Validate manifest JSON
        run: node -e 'JSON.parse(require("node:fs").readFileSync("manifest.json", "utf8"))'
